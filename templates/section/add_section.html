{% extends "layout/base.html" %}

{% block content %}

<h2 class="mb-4">

    <i class="bi bi-people-fill"></i>

    Add Section

</h2>

<form method="POST">

    <div class="row">

        <div class="col-md-6 mb-3">

            <label>Semester</label>

            <select name="semester" class="form-select" required>

                {% for sem in semesters %}

                <option value="{{ sem.id }}">

                    {{ sem.department.department_name }} - Semester {{ sem.semester }}

                </option>

                {% endfor %}

            </select>

        </div>

        <div class="col-md-6 mb-3">

            <label>Section Name</label>

            <input type="text" name="section_name" class="form-control" placeholder="A" required>

        </div>

        <div class="col-md-6 mb-4">

            <label>Student Strength</label>

            <input type="number" name="strength" class="form-control" required>

        </div>

    </div>

    <button class="btn btn-success">

        Save Section

    </button>

    <a href="/sections" class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
