{% extends "layout/base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>
        <i class="bi bi-people-fill"></i>
        Section Management
    </h2>

    <a href="/sections/add" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i>
        Add Section
    </a>

</div>

<table class="table table-bordered table-hover shadow">

    <thead class="table-primary">

        <tr>

            <th>ID</th>

            <th>Semester</th>

            <th>Section</th>

            <th>Strength</th>

            <th>Action</th>

        </tr>

    </thead>

    <tbody>

        {% for sec in sections %}

        <tr>

            <td>{{ loop.index }}</td>

            <td>Semester {{ sec.semester.semester }}</td>

            <td>{{ sec.section_name }}</td>

            <td>{{ sec.strength }}</td>

            <td>

                <a href="/sections/delete/{{ sec.id }}" class="btn btn-danger btn-sm">

                    Delete

                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
