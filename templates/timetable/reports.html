{% extends "layout/base.html" %}

{% block title %}Timetable Reports{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>
                📊 Timetable Reports
            </h3>

        </div>

        <div class="card-body">

            <p class="text-muted">

                Download the generated timetable in different formats.

            </p>

            <div class="row">

                <div class="col-md-3">

                    <a href="{{ url_for('timetable.export_excel') }}" class="btn btn-success w-100">

                        📗 Export Excel

                    </a>

                </div>

                <div class="col-md-3">

                    <a href="{{ url_for('timetable.export_pdf') }}" class="btn btn-danger w-100">

                        📕 Export PDF

                    </a>

                </div>

                <div class="col-md-3">

                    <a href="{{ url_for('timetable.export_csv') }}" class="btn btn-primary w-100">

                        📄 Export CSV

                    </a>

                </div>

                <div class="col-md-3">

                    <a href="{{ url_for('timetable.timetable') }}" class="btn btn-secondary w-100">

                        👀 View Timetable

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
