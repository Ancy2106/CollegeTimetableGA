{% extends "layout/base.html" %}

{% block content %}

<h2>Add Faculty</h2>

<form method="POST">

    <div class="row">

        <div class="col-md-6 mb-3">

            <label>Name</label>

            <input type="text" name="faculty_name" class="form-control" required>

        </div>

        <div class="col-md-6 mb-3">

            <label>Faculty Code</label>

            <input type="text" name="faculty_code" class="form-control" required>

        </div>

        <div class="col-md-6 mb-3">

            <label>Department</label>

            <input type="text" name="department" class="form-control" required>

        </div>

        <div class="col-md-6 mb-3">

            <label>Designation</label>

            <input type="text" name="designation" class="form-control" required>

        </div>

        <div class="col-md-6 mb-3">

            <label>Email</label>

            <input type="email" name="email" class="form-control" required>

        </div>

        <div class="col-md-6 mb-3">

            <label>Phone</label>

            <input type="text" name="phone" class="form-control" required>

        </div>

        <div class="col-md-6 mb-3">

            <label>Availability</label>

            <select name="availability" class="form-control">

                <option>Full Time</option>

                <option>Morning Only</option>

                <option>Afternoon Only</option>

            </select>

        </div>

    </div>

    <button class="btn btn-primary">

        Save Faculty

    </button>

    <a href="/faculty" class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
