{% extends "layout/base.html" %}

{% block content %}

<h2>Add Department</h2>

<form method="POST">

    <div class="row">

        <div class="col-md-6 mb-3">

            <label>Department Name</label>

            <input type="text" name="department_name" class="form-control" placeholder="CSE / IT / ECE" required>

        </div>

        <div class="col-md-6 mb-3">

            <label>Semester</label>

            <input type="number" name="semester" class="form-control" min="1" max="8" required>

        </div>

        <div class="col-md-6 mb-3">

            <label>Section</label>

            <input type="text" name="section" class="form-control" placeholder="A" required>

        </div>

        <div class="col-md-6 mb-3">

            <label>Academic Year</label>

            <input type="text" name="academic_year" class="form-control" placeholder="2026-2027" required>

        </div>

    </div>

    <button class="btn btn-primary">

        Save Department

    </button>

    <a href="/departments" class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
