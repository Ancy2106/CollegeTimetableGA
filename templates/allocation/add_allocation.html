{% extends "layout/base.html" %}

{% block content %}

<h2 class="mb-4">

    Subject Allocation

</h2>

<form method="POST">

    <div class="row">

        <div class="col-md-6 mb-3">

            <label>Department</label>

            <select id="department" name="department" class="form-select" required>

                {% set seen_departments = [] %}

                {% for dept in departments %}

                {% if dept.department_name not in seen_departments %}

                <option value="{{ dept.id }}">

                    {{ dept.department_name }}

                </option>

                {% set _ = seen_departments.append(dept.department_name) %}

                {% endif %}

                {% endfor %}

            </select>

        </div>

        <div class="col-md-6 mb-3">

            <label>Semester</label>

            <select id="semester" name="semester" class="form-select" required>

                {% for sem in semesters %}

                <option value="{{ sem.semester }}">

                    Semester {{ sem.semester }}

                </option>

                {% endfor %}

            </select>

        </div>

        <div class="col-md-6 mb-3">

            <label>Section</label>

            <select id="section" name="section" class="form-select" required>

                {% for sec in sections %}

                <option value="{{sec.id}}">

                    {{sec.section_name}}

                </option>

                {% endfor %}

            </select>

        </div>

        <div class="col-md-6 mb-3">

            <label>Subject</label>

            <select id="subject" name="subject" class="form-select" required>

                {% for sub in subjects %}

                <option value="{{sub.id}}">

                    {{sub.subject_name}}

                </option>

                {% endfor %}

            </select>

        </div>

        <div class="col-md-6 mb-3">

            <label>Faculty</label>

            <select name="faculty" class="form-select" required>

                {% for fac in faculty %}

                <option value="{{fac.id}}">

                    {{fac.faculty_name}}

                </option>

                {% endfor %}

            </select>

        </div>

        <div class="col-md-3 mb-3">

            <label>Weekly Hours</label>

            <input type="number" name="weekly_hours" class="form-control" required>

        </div>

        <div class="col-md-3 mb-3">

            <label>Subject Type</label>

            <select name="subject_type" class="form-select">

                <option>Theory</option>

                <option>Lab</option>

            </select>

        </div>

        <div class="col-md-3 mb-3">

            <label>Consecutive Hours</label>

            <select name="consecutive_hours" class="form-select">

                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>

            </select>

        </div>

        <div class="col-md-3 mb-3">

            <label>Preferred Room</label>

            <select name="preferred_room" class="form-select">

                <option>Theory</option>

                <option>Lab</option>

            </select>

        </div>

        <div class="col-md-3 mb-4">

            <label>Priority</label>

            <select name="priority" class="form-select">

                <option>High</option>

                <option>Medium</option>

                <option>Low</option>

            </select>

        </div>

    </div>

    <button class="btn btn-success">

        Save Allocation

    </button>

    <a href="/allocations" class="btn btn-secondary">

        Cancel

    </a>

</form>
<script>

    const departmentSelect =
        document.getElementById("department");

    const semesterSelect =
        document.getElementById("semester");

    const sectionSelect =
        document.getElementById("section");

    const subjectSelect =
        document.getElementById("subject");


    function loadSubjects() {

        const semesterId =
            semesterSelect.value;

        const sectionId =
            sectionSelect.value;

        if (!semesterId || !sectionId) {

            subjectSelect.innerHTML =
                `<option value="">Select section</option>`;

            return;
        }

        subjectSelect.innerHTML =
            `<option value="">Loading...</option>`;

        fetch(
            "/api/subjects/" +
            semesterId +
            "/" +
            sectionId
        )

            .then(response => response.json())

            .then(data => {

                subjectSelect.innerHTML = "";

                if (data.length === 0) {

                    subjectSelect.innerHTML =
                        `<option value="">No subjects available</option>`;

                    return;
                }

                data.forEach(item => {

                    subjectSelect.innerHTML +=
                        `<option value="${item.id}">
                    ${item.name}
                </option>`;

                });

            })

            .catch(error => {

                console.error(error);

                subjectSelect.innerHTML =
                    `<option value="">Error loading subjects</option>`;

            });

    }


    function loadSections() {

        const semesterId =
            semesterSelect.value;

        if (!semesterId) {

            sectionSelect.innerHTML =
                `<option value="">Select semester</option>`;

            return;
        }

        sectionSelect.innerHTML =
            `<option value="">Loading...</option>`;

        fetch(
            "/api/sections/" +
            semesterId
        )

            .then(response => response.json())

            .then(data => {

                sectionSelect.innerHTML = "";

                if (data.length === 0) {

                    sectionSelect.innerHTML =
                        `<option value="">No sections available</option>`;

                    subjectSelect.innerHTML =
                        `<option value="">Select section</option>`;

                    return;
                }

                data.forEach(item => {

                    sectionSelect.innerHTML +=
                        `<option value="${item.id}">
                    ${item.name}
                </option>`;

                });

                // IMPORTANT:
                // After section loads, immediately load subjects
                loadSubjects();

            })

            .catch(error => {

                console.error(error);

                sectionSelect.innerHTML =
                    `<option value="">Error loading sections</option>`;

            });

    }


    function loadSemesters() {

        const departmentId =
            departmentSelect.value;

        semesterSelect.innerHTML =
            `<option value="">Loading...</option>`;

        sectionSelect.innerHTML =
            `<option value="">Select semester</option>`;

        subjectSelect.innerHTML =
            `<option value="">Select section</option>`;

        fetch(
            "/api/semesters/" +
            departmentId
        )

            .then(response => response.json())

            .then(data => {

                semesterSelect.innerHTML = "";

                data.forEach(item => {

                    semesterSelect.innerHTML +=
                        `<option value="${item.id}">
                    Semester ${item.semester}
                </option>`;

                });

                loadSections();

            })

            .catch(error => {

                console.error(error);

                semesterSelect.innerHTML =
                    `<option value="">Error loading semesters</option>`;

            });

    }


    // Department changed
    departmentSelect.addEventListener(
        "change",
        function () {

            loadSemesters();

        }
    );


    // Semester changed
    semesterSelect.addEventListener(
        "change",
        function () {

            loadSections();

        }
    );


    // Section changed
    sectionSelect.addEventListener(
        "change",
        function () {

            loadSubjects();

        }
    );


    // Initial page load
    loadSemesters();

</script>

{% endblock %}
